ignore:
  resource_names:
    - Blueprint
    - Catalog
    - Classifier
    - Connection
    - Crawler
    - CustomEntityType
    - DataQualityRuleset
    - Database
    - DevEndpoint
    - Integration
    - IntegrationResourceProperty
    # - Job
    - MLTransform
    - Partition
    - PartitionIndex
    # - Registry  # ENABLED: Glue Schema Registry support (FEAT-a7f2c8d9)
    # - Schema    # ENABLED: Glue Schema support (FEAT-a7f2c8d9)
    - Script
    - SecurityConfiguration
    - Session
    - Table
    - TableOptimizer
    - Trigger
    - UsageProfile
    - UserDefinedFunction
    - Workflow
  field_paths:
    - Mapping.Children
    - CreateJobInput.AllocatedCapacity
    - UpdateJobInput.JobUpdate.AllocatedCapacity
resources:
  Job:
    renames:
      operations:
        GetJob:
          input_fields:
            JobName: Name
        UpdateJob:
          input_fields:
            JobName: Name
        DeleteJob:
          input_fields:
            JobName: Name
    fields:
      CodeGenConfigurationNodes.DynamicTransform.OutputSchemas.Columns.Type:
        go_tag: json:"type,omitempty"
      CodeGenConfigurationNodes.Filter.Filters.Values.Type:
        go_tag: json:"type,omitempty"
      CodeGenConfigurationNodes.DynamicTransform.Parameters.Type:
        go_tag: json:"type,omitempty"
      Role:
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      Tags:
        type: map[string]*string
    hooks:
      sdk_update_pre_build_request:
        template_path: hooks/job/sdk_update_pre_build_request.go.tpl
      sdk_update_post_build_request:
        template_path: hooks/job/sdk_update_post_build_request.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/job/sdk_read_one_post_set_output.go.tpl
      sdk_file_end:
        template_path: hooks/job/sdk_file_end.go.tpl
    exceptions:
      terminal_codes:
        - InvalidInputException
      errors:
        404:
          code: EntityNotFoundException

  Registry:
    renames:
      operations:
        GetRegistry:
          input_fields:
            RegistryId.RegistryName: RegistryName
        UpdateRegistry:
          input_fields:
            RegistryId.RegistryName: RegistryName
        DeleteRegistry:
          input_fields:
            RegistryId.RegistryName: RegistryName
    fields:
      Tags:
        type: map[string]*string
    exceptions:
      terminal_codes:
        - InvalidInputException
        - AccessDeniedException
      errors:
        404:
          code: EntityNotFoundException

  Schema:
    renames:
      operations:
        GetSchemaByDefinition:
          input_fields:
            SchemaId.SchemaName: SchemaName
        RegisterSchemaVersion:
          input_fields:
            SchemaId.SchemaName: SchemaName
        UpdateSchema:
          input_fields:
            SchemaId.SchemaName: SchemaName
        DeleteSchema:
          input_fields:
            SchemaId.SchemaName: SchemaName
    fields:
      Tags:
        type: map[string]*string
    exceptions:
      terminal_codes:
        - InvalidInputException
        - AccessDeniedException
        - IncompatibleSchemaException
      errors:
        404:
          code: EntityNotFoundException
