                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              compatibility:
                description: |-
                  The current compatibility mode setting for the registry.
                  This reflects the actual state in AWS and may differ from spec.compatibility
                  if an update is in progress or if there was an error applying the change.
                type: string
              conditions:
                description: |-
                  All CRs managed by ACK have a common `Status.Conditions` member that
                  contains a collection of `ackv1alpha1.Condition` objects that describe
                  the various terminal states of the CR and its backend AWS service API
                  resource
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              dependentSchemaCount:
                description: |-
                  The number of schemas that are currently using this registry.
                  This count is used to enforce referential integrity - a registry with
                  dependent schemas cannot be deleted until the schemas are removed or
                  reassigned to a different registry.
                format: int64
                type: integer
              registryARN:
                description: The Amazon Resource Name (ARN) of the registry.
                type: string
            type: object
        type: object
