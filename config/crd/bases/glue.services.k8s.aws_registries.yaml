            type: string
          metadata:
            type: object
          spec:
            description: |-
              RegistrySpec defines the desired state of Registry.

              Represents an AWS Glue Schema Registry for managing schema versions
              with compatibility rules.
            properties:
              compatibility:
                description: |-
                  The compatibility mode for schema evolution in this registry.
                  Valid values are:
                    - NONE: No compatibility mode applies. You can use this choice in development
                      scenarios or if you do not know the compatibility mode that you want to apply.
                      Any new version added will be accepted without undergoing a compatibility check.
                    - DISABLED: This compatibility choice prevents versioning for a particular schema.
                      You can use this choice to prevent future versioning of a schema.
                    - BACKWARD: This compatibility choice is recommended as it allows data receivers
                      to read both current and previous schema versions. This means that, for instance,
                      a new schema version cannot drop data fields.
                    - BACKWARD_ALL: This compatibility choice allows data receivers to read data written
                      by producers of all previous schema versions. Data receivers must be able to read
                      data written by producers of all previous schema versions. This means that a new
                      schema version cannot drop data fields.
                    - FORWARD: This compatibility choice allows data receivers to read data written by
                      producers of future schema versions. Data receivers must be able to read data written
                      by producers of all future schema versions. This means that a new schema version cannot
                      add data fields that were not present in a previous schema version.
                    - FORWARD_ALL: This compatibility choice allows data receivers to read data written by
                      producers of all future schema versions. Data receivers must be able to read data written
                      by producers of all future schema versions. This means that a new schema version cannot
                      add data fields that were not present in a previous schema version.
                    - FULL: This compatibility choice allows data receivers to read both current and previous
                      schema versions, and allows data receivers to read data written by producers of future
                      schema versions. This means that a new schema version can neither drop data fields nor add
                      data fields that were not present in a previous schema version.
                    - FULL_ALL: This compatibility choice allows data receivers to read data written by producers
                      of all previous and future schema versions. This means that a new schema version can neither
                      drop data fields nor add data fields that were not present in a previous schema version.
                enum:
                - NONE
                - DISABLED
                - BACKWARD
                - FORWARD
                - FULL
                - BACKWARD_ALL
                - FORWARD_ALL
                - FULL_ALL
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  Determines whether the AWS resource is deleted when the Registry CRD is deleted.
                  Valid values are:
                    - Delete: The AWS Glue Registry will be deleted when the CRD is deleted
                    - Retain: The AWS Glue Registry will be retained when the CRD is deleted
                enum:
                - Delete
                - Retain
                type: string
              description:
